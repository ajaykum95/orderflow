server:
  port: 8081
  error:
    include-message: always   # Show actual message in error responses

# Initial settings for intentional failures (chaos), can be changed at runtime via /api/chaos
payment:
  chaos:
    failure-rate: 0.0     # 0.0 to 1.0; probability of returning 503 (gateway down)
    slow-rate: 0.0        # Probability of a slow response
    slow-delay-ms: 3000   # Delay duration (in ms) for slow responses