server:
  port: 8080
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/orderflow
    username: orderflow
    password: orderflow
  jpa:
    hibernate:
      ddl-auto: update
  data:
    mongodb:
      # Timeouts छोटे हैं: Mongo बंद हो तो हम 30 सेकंड नहीं अटकेंगे (पहले जैसे payment में timeout ज़रूरी था)
      uri: mongodb://localhost:27018/orderflow?serverSelectionTimeoutMS=2000&connectTimeoutMS=2000&socketTimeoutMS=3000
      auto-index-creation: true     # @Indexed तभी बनते हैं जब यह true हो (डिफ़ॉल्ट false है)
  temporal:
    connection:
      target: localhost:7233
    namespace: default
    workers-auto-discovery:
      packages: com.orderflow.order.workflow
  mail:
    host: localhost
    port: 1025            # MailHog का SMTP port (docker-compose में पहले से खुला है)
    properties:
      mail.smtp.connectiontimeout: 3000   # timeout ज़रूरी है, वरना बंद SMTP पर हम अटके रहेंगे
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
app:
  jwt:
    secret: ajuugGHDCVH@#scjbvhsgvgvshdcgsvgv@&*sfhhvh
    expiry-minutes: 60
  payment:
    base-url: http://localhost:8081
    connect-timeout-ms: 1000
    read-timeout-ms: 2000
  workflow:
    # इसी list का क्रम तय करता है कि अगला step क्या होगा
    steps:
      - RESERVE_STOCK
      - PAYMENT
      - INVOICE
      - NOTIFY
    simulate-invoice-failure: false   # जाँच के लिए true करके refund वाला rollback देख सकते हैं
  invoice:
    seller-name: OrderFlow Demo Store
    seller-address: "221B Demo Street, Gurugram, Haryana"
    seller-gstin: "06AAAAA0000A1Z5"      # नकली GSTIN
    currency: INR
    # टैक्स की दरें: GST 18% चाहिए तो एक नियम; CGST+SGST में बाँटना हो तो नीचे वाला रूप
    tax-rules:
      - name: CGST
        rate: 9
      - name: SGST
        rate: 9
  notification:
    from: no-reply@orderflow.local
    enabled: true
  report:
    # हर रात 12:05 (भारतीय समय) बीते कल की report। जाँचने के लिए "0 * * * * *" करें (हर मिनट)
    daily-cron: "0 5 0 * * *"
resilience4j:
  circuitbreaker:
    instances:
      paymentService:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10                 # आख़िरी 10 calls देखो
        minimumNumberOfCalls: 5               # कम से कम 5 calls के बाद ही फैसला
        failureRateThreshold: 50              # 50% से ज़्यादा fail -> OPEN
        waitDurationInOpenState: 15s          # 15 सेकंड बंद रहेगा
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - com.orderflow.order.payment.exceptions.PaymentUnavailableException
  retry:
    instances:
      paymentService:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - com.orderflow.order.payment.exceptions.PaymentUnavailableException
        ignoreExceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
