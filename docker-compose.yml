services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_DB: orderflow, POSTGRES_USER: orderflow, POSTGRES_PASSWORD: orderflow }
    ports: ["5433:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
  mailhog:
    image: mailhog/mailhog
    ports: ["1025:1025", "8025:8025"]   # 8025 = email देखने का web page
  temporal:
    image: temporalio/temporal:latest
    command: [ "server", "start-dev", "--ip", "0.0.0.0" ]
    ports:
      - "7233:7233"   # app इससे बात करता है
      - "8233:8233"   # Web UI: http://localhost:8233

  # नोट: यह dev-mode server है; इसका data container बंद होने पर मिट जाता है (सीखने/demo के लिए ठीक)
