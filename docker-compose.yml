services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_DB: orderflow, POSTGRES_USER: orderflow, POSTGRES_PASSWORD: orderflow }
    ports: ["5433:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
  mailhog:
    image: mailhog/mailhog
    ports: ["1025:1025", "8025:8025"]   # 8025 = email देखने का web page
  # Temporal बाद में (Module 5) जोड़ेंगे
