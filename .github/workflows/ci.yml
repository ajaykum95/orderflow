name: CI

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: order-service (tests + coverage)
        working-directory: order-service
        run: mvn -B -ntp verify

      - name: payment-service (tests + coverage)
        working-directory: payment-service
        run: mvn -B -ntp verify

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            order-service/target/surefire-reports
            order-service/target/failsafe-reports
            payment-service/target/surefire-reports

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: order-service/target/site/jacoco

      - name: Generate coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: order-service/target/site/jacoco/jacoco.csv
          badges-directory: .github/badges
          generate-branches-badge: true

      - name: Commit badge to repo
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges
          git diff --cached --quiet || (git commit -m "chore: update coverage badge" && git push)